# Render blueprint: the API as a Docker web service. The database is external:
# Render's free PostgreSQL expires after 30 days, so use one that does not, such as
# Neon's free plan (https://neon.com). See "Deploying" in the README.
#
# Deploy from the Render dashboard (New > Blueprint) and point it at this
# repository. The image's default command applies any pending Prisma migrations
# before the server starts, so a fresh database is ready on first boot.
#
# Free-tier note: the web service sleeps after 15 minutes without traffic and the
# first request after that takes up to a minute. An uptime monitor calling /ping
# every few minutes keeps it awake; /ping never touches the database, so the
# database can still suspend when idle.

services:
  - type: web
    name: wastefi-backend
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      # The database connection string, entered in the dashboard. For Neon, use
      # the direct (unpooled) connection string; it ends in ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Generated once by Render. The server refuses to start in production
      # without unique values here. Never regenerate WALLET_ENCRYPTION_KEY: it
      # encrypts the custodial wallets stored in the database.
      - key: JWT_SECRET
        generateValue: true
      - key: WALLET_ENCRYPTION_KEY
        generateValue: true
      - key: REDIS_ENABLED
        value: 'false'
      - key: STELLAR_NETWORK
        value: testnet
      # Origin of the deployed frontend, for CORS.
      - key: CLIENT_URL
        sync: false
      # The first administrator, created at boot if none exists.
      - key: INITIAL_ADMIN_PHONE
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # Secret key of the contracts' admin account. Approved collections are
      # recorded and paid on Soroban only while this is set.
      - key: SOROBAN_ADMIN_SECRET
        sync: false
      # Demo data for the public deployment: collection points, a demo collector
      # and a demo collection point operator who both sign in with
      # DEMO_ACCOUNT_PASSWORD, and a few pending collections to approve.
      - key: SEED_DEMO_DATA
        value: 'true'
      - key: DEMO_ACCOUNT_PASSWORD
        sync: false
