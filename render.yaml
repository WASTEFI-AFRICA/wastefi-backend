# Render blueprint: the API as a Docker web service plus a managed PostgreSQL.
#
# Deploy from the Render dashboard (New > Blueprint) and point it at this
# repository. The image's default command applies any pending Prisma migrations
# before the server starts, so a fresh database is ready on first boot.
#
# After the first deploy, create the admin account (see "Deploying" in the README).
# Free-tier notes: the web service sleeps after inactivity, and the free database
# is deleted after 30 days. Use a paid plan for anything that must persist.

databases:
  - name: wastefi-db
    databaseName: wastefi
    plan: free

services:
  - type: web
    name: wastefi-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wastefi-db
          property: connectionString
      # Generated once by Render. The server refuses to start in production
      # without a unique value here.
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_ENABLED
        value: 'false'
      - key: STELLAR_NETWORK
        value: testnet
      # Origin of the deployed frontend, for CORS. Set it in the dashboard.
      - key: CLIENT_URL
        sync: false
