# Alert Rules for WasteFi API

groups:
  - name: api_alerts
    interval: 30s
    rules:
      # High Error Rate
      - alert: HighErrorRate
        expr: |
          rate(http_request_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # Critical Error Rate
      - alert: CriticalErrorRate
        expr: |
          rate(http_request_errors_total[5m]) > 0.10
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Critical API error rate"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 10%)"

      # Slow Response Time
      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "API response time is slow"
          description: "95th percentile response time is {{ $value }}s (threshold: 2s)"

      # Service Down
      - alert: ServiceDown
        expr: up{job="wastefi-api"} == 0
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "WasteFi API is down"
          description: "Service has been down for more than 1 minute"

      # High Request Rate
      - alert: HighRequestRate
        expr: |
          rate(http_requests_total[5m]) > 1000
        for: 5m
        labels:
          severity: info
          component: api
        annotations:
          summary: "High request rate detected"
          description: "Request rate is {{ $value }} req/s"

      # Database Query Slow
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database queries are slow"
          description: "95th percentile query time is {{ $value }}s (threshold: 1s)"

      # Low Cache Hit Rate
      - alert: LowCacheHitRate
        expr: |
          rate(cache_hits_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) < 0.7
        for: 10m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }} (threshold: 70%)"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes / 1024 / 1024 > 1024
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}MB (threshold: 1024MB)"

      # Payment Processing Failures
      - alert: HighPaymentFailureRate
        expr: |
          rate(payments_total{status="FAILED"}[10m]) / rate(payments_total[10m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: payments
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is {{ $value | humanizePercentage }}"

      # Collection Verification Backlog
      - alert: VerificationBacklog
        expr: |
          collections_total{status="PENDING"} > 100
        for: 30m
        labels:
          severity: warning
          component: collections
        annotations:
          summary: "High number of pending collections"
          description: "{{ $value }} collections are pending verification"
