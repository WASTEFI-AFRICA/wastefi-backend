# Railway build and deploy settings. See "Deploying" in the README for the
# dashboard steps (adding Postgres, variables, and a public domain).
#
# The image's default command applies pending Prisma migrations and then starts the
# server, so no start command is set here.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway only routes traffic to a deployment once this returns 200. /health also
# reports whether the database connection is up.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
